<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#1A1A2E"/>
  <circle cx="100" cy="100" r="85" fill="#0d1220"/>
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#4ECDC4" stroke-width="3"/>
  
  <!-- Three People Icons (Team) -->
  <!-- Center Person -->
  <circle cx="100" cy="70" r="15" fill="#4ECDC4"/>
  <path d="M 80 115 Q 80 90 100 90 Q 120 90 120 115 L 120 125 L 80 125 Z" fill="#4ECDC4"/>
  
  <!-- Left Person -->
  <circle cx="65" cy="85" r="12" fill="#4ECDC4" opacity="0.7"/>
  <path d="M 50 120 Q 50 100 65 100 Q 80 100 80 120 L 80 128 L 50 128 Z" fill="#4ECDC4" opacity="0.7"/>
  
  <!-- Right Person -->
  <circle cx="135" cy="85" r="12" fill="#4ECDC4" opacity="0.7"/>
  <path d="M 120 120 Q 120 100 135 100 Q 150 100 150 120 L 150 128 L 120 128 Z" fill="#4ECDC4" opacity="0.7"/>
  
  <!-- Workflow Lines -->
  <path d="M 50 140 L 150 140" fill="none" stroke="#FF6B35" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="50" cy="140" r="4" fill="#FF6B35"/>
  <circle cx="100" cy="140" r="4" fill="#FF6B35"/>
  <circle cx="150" cy="140" r="4" fill="#FF6B35"/>
  
  <!-- Label -->
  <text x="100" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">PROFESSIONAL</text>
</svg>
