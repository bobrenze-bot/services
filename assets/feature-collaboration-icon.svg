<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Three Connected Nodes -->
  <circle cx="20" cy="25" r="8" fill="#FF6B35"/>
  <circle cx="44" cy="25" r="8" fill="#4ECDC4"/>
  <circle cx="32" cy="48" r="8" fill="#FF6B35"/>
  
  <!-- Connection Lines -->
  <line x1="20" y1="25" x2="44" y2="25" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  <line x1="20" y1="25" x2="32" y2="48" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
  <line x1="44" y1="25" x2="32" y2="48" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
</svg>
