<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#1A1A2E"/>
  <circle cx="100" cy="100" r="85" fill="#0d1220"/>
  
  <!-- Outer Ring with gradient effect -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#FF6B35" stroke-width="4"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#4ECDC4" stroke-width="2"/>
  
  <!-- Building/Organization Icon -->
  <rect x="70" y="60" width="60" height="70" fill="#FF6B35" rx="3"/>
  <rect x="75" y="70" width="12" height="12" fill="#1A1A2E"/>
  <rect x="75" y="90" width="12" height="12" fill="#1A1A2E"/>
  <rect x="75" y="110" width="12" height="12" fill="#1A1A2E"/>
  <rect x="94" y="70" width="12" height="12" fill="#1A1A2E"/>
  <rect x="94" y="90" width="12" height="12" fill="#1A1A2E"/>
  <rect x="94" y="110" width="12" height="12" fill="#1A1A2E"/>
  <rect x="113" y="70" width="12" height="12" fill="#1A1A2E"/>
  <rect x="113" y="90" width="12" height="12" fill="#1A1A2E"/>
  <rect x="113" y="110" width="12" height="12" fill="#1A1A2E"/>
  
  <!-- Strategic Network Lines -->
  <line x1="50" y1="100" x2="70" y2="100" stroke="#4ECDC4" stroke-width="2"/>
  <line x1="130" y1="100" x2="150" y2="100" stroke="#4ECDC4" stroke-width="2"/>
  <circle cx="50" cy="100" r="5" fill="#4ECDC4"/>
  <circle cx="150" cy="100" r="5" fill="#4ECDC4"/>
  
  <!-- Top Connection -->
  <line x1="100" y1="40" x2="100" y2="60" stroke="#4ECDC4" stroke-width="2"/>
  <circle cx="100" cy="40" r="5" fill="#4ECDC4"/>
  
  <!-- Label -->
  <text x="100" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">ENTERPRISE</text>
</svg>
