<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A2E;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Abstract Neural Network Lines -->
  <g opacity="0.3">
    <!-- Horizontal Lines -->
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#FF6B35" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#4ECDC4" stroke-width="1"/>
    
    <!-- Diagonal Lines -->
    <line x1="0" y1="400" x2="400" y2="0" stroke="#4ECDC4" stroke-width="0.5" opacity="0.5"/>
    <line x1="800" y1="400" x2="1200" y2="0" stroke="#FF6B35" stroke-width="0.5" opacity="0.5"/>
  </g>
  
  <!-- Connection Nodes -->
  <circle cx="200" cy="100" r="8" fill="#4ECDC4" opacity="0.8"/>
  <circle cx="400" cy="200" r="10" fill="#FF6B35" opacity="0.8"/>
  <circle cx="600" cy="150" r="6" fill="#4ECDC4" opacity="0.8"/>
  <circle cx="800" cy="250" r="12" fill="#FF6B35" opacity="0.8"/>
  <circle cx="1000" cy="100" r="8" fill="#4ECDC4" opacity="0.8"/>
  
  <!-- Connection Lines Between Nodes -->
  <line x1="200" y1="100" x2="400" y2="200" stroke="#4ECDC4" stroke-width="2" opacity="0.6"/>
  <line x1="400" y1="200" x2="600" y2="150" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
  <line x1="600" y1="150" x2="800" y2="250" stroke="#FF6B35" stroke-width="2" opacity="0.6"/>
  <line x1="800" y1="250" x2="1000" y2="100" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
  
  <!-- AI/Human Symbol -->
  <g transform="translate(600, 200)">
    <!-- Human Silhouette -->
    <circle cx="-60" cy="-30" r="20" fill="#FF6B35" opacity="0.9"/>
    <path d="M -80 30 Q -80 0 -60 0 Q -40 0 -40 30" fill="none" stroke="#FF6B35" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Connection -->
    <line x1="-40" y1="0" x2="0" y2="0" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="5 3"/>
    
    <!-- AI Symbol -->
    <rect x="10" y="-25" width="40" height="50" fill="#4ECDC4" opacity="0.9" rx="5"/>
    <text x="30" y="10" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#1A1A2E">AI</text>
    
    <!-- Data Flow -->
    <circle cx="-20" cy="-10" r="3" fill="#FFFFFF" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-10" cy="0" r="3" fill="#FFFFFF" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
  
  <!-- Decorative Circles -->
  <circle cx="100" cy="350" r="50" fill="none" stroke="#4ECDC4" stroke-width="1" opacity="0.2"/>
  <circle cx="1100" cy="50" r="80" fill="none" stroke="#FF6B35" stroke-width="1" opacity="0.2"/>
  
  <!-- Bottom Accent Line -->
  <line x1="0" y1="380" x2="1200" y2="380" stroke="#FF6B35" stroke-width="3"/>
</svg>
